name: GitHub Pages Canlı Yayın

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4
      - name: Python kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Statik web portalını derle
        run: python scripts/build_site.py
      - name: GitHub Pages yapılandır
        uses: actions/configure-pages@v5
      - name: Site paketini yükle
        uses: actions/upload-pages-artifact@v3
        with:
          path: "site"
      - name: Canlıya al (GitHub Pages)
        id: deployment
        uses: actions/deploy-pages@v4
