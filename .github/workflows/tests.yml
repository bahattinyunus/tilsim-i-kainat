name: Simülasyon Testleri

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Birim testleri
        run: python -m unittest discover -s simulations -p "test_*.py" -v
      - name: Senaryo karşılaştırması
        run: python simulations/ene-thickening-model.py --karsilastir
