name: Simülasyon Testleri

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Birim testleri (73 Test)
        run: python -m unittest discover -s simulations -p "test_*.py" -v
      - name: Ene Kalınlaşma Senaryoları
        run: python simulations/ene-thickening-model.py --karsilastir
      - name: Tahavvülât-ı Zerrât Senaryoları
        run: python simulations/zerre-simulation.py --karsilastir
      - name: İhlas ve Şahs-ı Manevî Senaryoları
        run: python simulations/ihlas-synergy-model.py --karsilastir
      - name: Kozmik Entropi ve Bilgi Senaryoları
        run: python simulations/entropy-information-model.py --karsilastir
      - name: Tayy-ı Mekân ve Kuantum Işınlanma Senaryosu
        run: python simulations/teleportation-information-model.py --mesafe 2500 --kutle 500
      - name: Kader ve İrade Matrisi Senaryoları
        run: python simulations/kader-irade-matrix-model.py --karsilastir
      - name: Haşir ve Bilgi Korunumu Senaryoları
        run: python simulations/hasir-ebediyet-model.py --karsilastir
      - name: Hayat ve Şuur Senaryoları
        run: python simulations/hayat-suur-model.py --tablo
      - name: Mirac ve Görelilik Senaryoları
        run: python simulations/mirac-relativity-model.py --tablo
      - name: Mânâ-yı Harfî ve İlişkisel Kuantum Senaryoları
        run: python simulations/nazar-rqm-model.py --tablo
      - name: Holografik Âlem-i Misâl ve Ehadiyet Senaryoları
        run: python simulations/holographic-ayine-model.py --tablo
      - name: Bütünleşik Simülasyon İcmali
        run: python simulations/run_all.py
